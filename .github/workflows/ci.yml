name: Tests and deploy

# Every push and pull request runs the tests. A push to main that passes them is deployed to
# the server, when the DEPLOY_* secrets are set (docs/deployment.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_agent_test
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install packages
        run: |
          pip install --no-deps -r requirements.lock
          pip install "pytest>=8.0,<9.0" "pytest-asyncio>=0.24,<1.0" "pytest-timeout>=2.3,<3.0" "ruff==0.17.5"
      - name: Lint
        run: |
          ruff check src/ scripts/ tests/
          ruff format --check src/ scripts/ tests/
      - name: Unit and integration tests
        env:
          TEST_POSTGRES_URL: postgresql://rag_user:ci-only-password@localhost:5432/rag_agent_test
        run: pytest tests/unit tests/integration -q

  frontend:
    name: Interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: node --test tests/stream.test.js
      - name: Browser tests
        run: npx playwright test
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST is not set; nothing to deploy."
      - uses: actions/checkout@v7
        if: env.DEPLOY_HOST != ''
      - name: Send the release and rebuild on the server
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=30 "deploy@$DEPLOY_HOST" "${GITHUB_SHA::7}"
      - name: Check the live site
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$DEPLOY_URL/v1/health"
