# Local development: mount the application source and preserve local service data.
# Include after compose.minimal.yml.
services:
  api:
    image: financial-research-assistant-api:local
    build: !override
      context: .
      dockerfile: Dockerfile.local
    environment:
      REQUEST_TRACE_DIR: /app/logs/traces
      # The image is not tied to a commit; the source is mounted from this checkout.
      GIT_SHA: unknown
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs/traces:/app/logs/traces
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
  qdrant:
    ports: !override
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
